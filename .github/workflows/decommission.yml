name: Decomission all workloads

on:
  workflow_dispatch:

jobs:
  destroy:
    if: github.repository != 'sentania-labs/vcf-lab-application-template'
    runs-on: lab

    env:
      # State backend credentials (lab S3). The S3 backend reads the AWS_*
      # names, so the lab key is passed under them; nothing here talks to AWS.
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_S3_SECRET_ACCESS_KEY }}
      VCFA_PROJECT_NAME: ${{ secrets.VCFA_PROJECT_NAME }}
      VCFA_PROJECT_ID:   ${{ secrets.VCFA_PROJECT_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      # vSphere / vRA / VCF environment-specific credentials
      TF_VAR_vcfa_refresh_token: ${{ secrets.VCFA_REFRESH_TOKEN}}
      TF_VAR_project_name: ${{ secrets.VCFA_PROJECT_NAME}}
      TF_VAR_vcfa_organization: ${{ secrets.VCFA_ORGANIZATION_NAME}}
      TF_VAR_vcfa_url: ${{ vars.VCFA_URL}}
      TF_VAR_dns_server: ${{ secrets.DNS_SERVER }}
      TF_VAR_krb_realm: ${{ secrets.KRB_REALM }}
      TF_VAR_serviceAccountUserName: ${{ secrets.KRB_SERVICE_USER }}
      TF_VAR_serviceAccountPassword: ${{ secrets.SERVICEACCOUNTPASSWORD }}
      KRB5_CONFIG: ${{ secrets.KRB5_CONF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute Terraform state key
        id: tfstate
        shell: bash
        run: |
          PROJECT_SLUG=$(echo "$VCFA_PROJECT_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]+/-/g; s/^-//; s/-$//')

          PROJECT_ID_SHORT=$(echo "$VCFA_PROJECT_ID" | cut -d- -f1)

          TF_STATE_KEY="vra/${PROJECT_SLUG}__${PROJECT_ID_SHORT}/terraform.tfstate"

          echo "TF_STATE_KEY=$TF_STATE_KEY" >> "$GITHUB_ENV"

          echo "$TF_STATE_KEY"

      - name: Terraform Init
        run: |
          terraform init -migrate-state -input=false -upgrade \
          -backend-config="key=${TF_STATE_KEY}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var-file="envs/lab.tfvars"
